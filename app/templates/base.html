<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Employee Directory{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark navbar-expand-lg mb-4" style="background-color:#1f2937;">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">📋 Employee Directory</a>
      <span class="badge bg-secondary">MySQL + Redis on Kubernetes</span>
    </div>
  </nav>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <footer class="text-center text-muted mt-5 mb-3">
    <small>Kubernetes Training Project &mdash; Python / MySQL / Redis</small>
  </footer>
</body>
</html>
